name: Publish Birja presentation
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate and prepare presentation
        run: |
          node --check app.js
          test -s index.html
          test -s style.css
          mkdir -p _site
          cp index.html style.css app.js _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload presentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
